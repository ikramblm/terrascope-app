# -Xmx8G used to be requested here, but this machine only has 7G of RAM
# total — R8's release-build minification pushes the daemon hard enough
# to actually try to grow into that impossible headroom, crashing the
# JVM outright (native mmap failure) rather than just running slowly.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
